services:
  - type: web
    name: delta-skymiles-roblox
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn website.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skymiles-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
databases:
  - name: skymiles-db
    plan: basic-256mb
