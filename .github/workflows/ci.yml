name: Delta Air Lines Web CI
on:
  pull_request:
  push:
    branches: [main, feat/crew-and-flight-integration]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q website
      - run: pytest -q
        env:
          DATABASE_URL: sqlite://
          SESSION_SECRET: unit-test-secret-with-32-or-more-characters
          COOKIE_SECURE: 'false'
