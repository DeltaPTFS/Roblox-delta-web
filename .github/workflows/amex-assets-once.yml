name: Prepare optimized AMEX assets (one-time)
on:
  push:
    branches: [fix-amex-image-delivery]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-amex-image-delivery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==12.0.0
      - name: Encode original card images and validate full decoding
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for tier in ("platinum", "reserve", "gold", "purple"):
              src = Path(f"website/static/amex-{tier}-transparent.png")
              dst = Path(f"website/static/amex-{tier}-fast-v1.webp")
              im = Image.open(src).convert("RGBA")
              im.load()
              im.thumbnail((1258,800), Image.Resampling.LANCZOS)
              im.save(dst, "WEBP", quality=92, method=6, exact=True)
              out = Image.open(dst)
              out.load()
              assert out.size == (1258,800) and out.mode == "RGBA"
              assert dst.stat().st_size < 250000
              print(tier, src.stat().st_size, dst.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/static/amex-*-fast-v1.webp
          if ! git diff --cached --quiet; then
            git commit -m "Bundle four optimized transparent WebP card assets"
            git push origin HEAD:fix-amex-image-delivery
          fi
