name: Optimize Delta Advertisements
on:
  push:
    branches:
      - feat/rotating-delta-ads-five-seconds
    paths:
      - "_ad_source/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rotating-delta-ads-five-seconds
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow==11.3.0 gdown==5.2.0
      - name: Optimize original PNG advertisements for production
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import gdown
          source = Path("_ad_source")
          source.mkdir(exist_ok=True)
          source_files = {
            "delta-lax": "1qJ6BHw83JjZ0Z0SBl-tp_880d4-EPwr8",
            "delta-new-york": "1e6yOLd-pvUSsqPxOwYjsTymtEBqhHj0x",
            "delta-skipping": "1-q6Pxeq5xF8sMZEkANSQzZsVvzsMH7zl",
            "delta-engine": "1naceGxRgJN22a9I_nO8ZRAnmd6N6pHLi",
            "delta-tech-ops": "19zUz3YjyLbrVlHgRRqDenerPjoS6gbje",
            "delta-centennial-ad": "1yN_MMstdTo0CexQD-RxLu7t0DW7mYA77",
          }
          for name, file_id in source_files.items():
              source_path=source / (name+".png")
              if not source_path.exists():
                  saved = gdown.download(id=file_id, output=str(source_path), quiet=False, fuzzy=True)
                  if not saved or not source_path.exists():
                      raise RuntimeError("Could not download the shared Google Drive image: "+name)
          output = Path("website/static/ads")
          output.mkdir(parents=True, exist_ok=True)
          names = {
            "delta-lax": "delta-lax.webp",
            "delta-new-york": "delta-new-york.webp",
            "delta-centennial-ad": "delta-centennial-ad.webp",
            "delta-tech-ops": "delta-tech-ops.webp",
            "delta-engine": "delta-engine.webp",
            "delta-skipping": "delta-skipping.webp",
          }
          for name, target in names.items():
              original=source / (name + ".png")
              if not original.exists(): continue
              with Image.open(original) as im:
                  im=im.convert("RGB")
                  im.thumbnail((2048, 1400),Image.Resampling.LANCZOS)
                  im.save(output / target, "WEBP", quality=85, method=6)
                  print(original.name, "=>", target, im.size, (output / target).stat().st_size)
          PY
      - name: Commit optimized ads, remove uncompressed originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/static/ads
          git rm -r -f _ad_source || true
          rm -rf _ad_source
          if ! git diff --cached --quiet; then
            git commit -m "Optimize six Delta Google Drive ads into static WebP assets"
            git push origin HEAD:feat/rotating-delta-ads-five-seconds
          fi
