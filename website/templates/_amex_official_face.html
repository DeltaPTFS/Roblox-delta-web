{# Approved high-resolution card artwork, served directly by this website. #}
{% macro card_face(tier) %}
<div class="amex-official-face amex-official-face--{{ tier }}" data-card-face="{{ tier }}">
  <img class="amex-local-card" src="/static/amex-{{ tier }}-transparent.png" width="1573" height="1000" alt="SkyMiles {{ 'alternate Reserve' if tier == 'purple' else tier|title }} sample card artwork" decoding="async">
</div>
{% endmacro %}
