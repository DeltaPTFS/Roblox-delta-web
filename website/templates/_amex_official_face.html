{# Approved high-resolution card illustrations are bundled in the website.
    Preserve their original sample cardholder text and transparent corners. #}
{% macro card_face(tier, priority='auto') %}
<div class="amex-official-face amex-official-face--{{ tier }}" data-card-face="{{ tier }}">
  <img src="/static/amex-{{ tier }}-transparent.png" alt="SkyMiles {{ 'alternate Reserve' if tier == 'purple' else tier|title }} sample card illustration" width="1573" height="1000" loading="eager" fetchpriority="{{ priority }}" decoding="{{ 'sync' if priority == 'high' else 'async' }}">
</div>
{% endmacro %}
